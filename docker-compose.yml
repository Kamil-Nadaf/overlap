# One command to run everything:  cp .env.example .env  &&  docker compose up -d --build
# Web UI:      http://localhost:${WEB_PORT:-8080}
# Test emails: http://localhost:8025  (Mailpit catches reminder emails in dev)
name: overlap

services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: overlap
      AUTHENTICATOR_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d overlap']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/overlap
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: '5000'
    # Not published to the host: the web container proxies /api to it.

  web:
    build:
      context: .
      args:
        VITE_BASE: /
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/overlap
      APP_URL: ${APP_URL:-http://localhost:8080}
      MAIL_FROM: ${MAIL_FROM:-Overlap <overlap@localhost>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      POLL_SECONDS: ${POLL_SECONDS:-60}

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'

volumes:
  db-data:
