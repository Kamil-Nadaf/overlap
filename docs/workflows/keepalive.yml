name: Supabase keepalive

# Only needed if you use hosted Supabase (free projects pause after 7 days without API requests).
# Does nothing when the secrets are not set.
on:
  schedule:
    - cron: '23 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping() RPC
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No Supabase secrets set, skipping."; exit 0; fi
          URL="${URL%/}"; URL="${URL%/rest/v1}"
          AUTH=""; case "$KEY" in sb_*) ;; *) AUTH="Authorization: Bearer $KEY";; esac
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" ${AUTH:+-H "$AUTH"} \
            -H "Content-Type: application/json" -d '{}'
